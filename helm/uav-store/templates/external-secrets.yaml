# Thay thế Sealed Secrets: secret sống ở AWS Secrets Manager, ESO kéo vào cluster.
# Auth: KHÔNG khai báo — ESO dùng default credential chain = IAM role của EC2 node (IMDS).
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: uav-store-secrets
  namespace: {{ include "uav-store.namespace" . }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  # target trùng TÊN + KEY với secret cũ → mọi secretKeyRef trong values giữ nguyên
  target:
    name: uav-store-secrets
  data:
    - secretKey: jwt-secret
      remoteRef: { key: uav-store/app, property: jwt-secret }
    - secretKey: payos-client-id
      remoteRef: { key: uav-store/app, property: payos-client-id }
    - secretKey: payos-api-key
      remoteRef: { key: uav-store/app, property: payos-api-key }
    - secretKey: payos-checksum-key
      remoteRef: { key: uav-store/app, property: payos-checksum-key }
    # 4 database chung 1 RDS + chung user postgres → 4 key cùng trỏ về uav-store/db
    - secretKey: user-db-password
      remoteRef: { key: uav-store/db, property: password }
    - secretKey: product-db-password
      remoteRef: { key: uav-store/db, property: password }
    - secretKey: order-db-password
      remoteRef: { key: uav-store/db, property: password }
    - secretKey: payment-db-password
      remoteRef: { key: uav-store/db, property: password }
