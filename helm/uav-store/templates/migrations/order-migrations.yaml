apiVersion: v1
kind: ConfigMap
metadata:
  name: order-migrations
  namespace: {{ include "uav-store.namespace" . }}
data:
  000001_create_cart_items.sql: |
    CREATE TABLE IF NOT EXISTS cart_items (
        id           BIGSERIAL PRIMARY KEY,
        user_id      UUID NOT NULL,
        product_id   UUID NOT NULL,
        product_name VARCHAR(255) NOT NULL,
        unit_price   DECIMAL(12,2) NOT NULL CHECK (unit_price >= 0),
        image_url    TEXT,
        quantity     INT NOT NULL DEFAULT 1 CHECK (quantity > 0),
        updated_at   TIMESTAMP NOT NULL DEFAULT NOW(),
        UNIQUE (user_id, product_id)
    );
    CREATE INDEX IF NOT EXISTS idx_cart_items_user_id ON cart_items(user_id);

  000002_create_orders.sql: |
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE TABLE IF NOT EXISTS orders (
        id             UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
        user_id        UUID NOT NULL,
        total_price    DECIMAL(12,2) NOT NULL CHECK (total_price >= 0),
        status         VARCHAR(20) NOT NULL DEFAULT 'PENDING'
                       CHECK (status IN ('PENDING', 'PAID', 'PROCESSING', 'CANCELLED')),
        payment_method VARCHAR(20) NOT NULL
                       CHECK (payment_method IN ('VNPAY', 'CASH')),
        created_at     TIMESTAMP NOT NULL DEFAULT NOW(),
        updated_at     TIMESTAMP NOT NULL DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_orders_user_id ON orders(user_id);
    CREATE INDEX IF NOT EXISTS idx_orders_status ON orders(status);

  000003_create_order_items.sql: |
    CREATE TABLE IF NOT EXISTS order_items (
        id           BIGSERIAL PRIMARY KEY,
        order_id     UUID NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
        product_id   UUID NOT NULL,
        product_name VARCHAR(255) NOT NULL,
        unit_price   DECIMAL(12,2) NOT NULL CHECK (unit_price >= 0),
        image_url    TEXT,
        quantity     INT NOT NULL CHECK (quantity > 0)
    );
    CREATE INDEX IF NOT EXISTS idx_order_items_order_id ON order_items(order_id);

  000004_extend_order_states_and_methods.sql: |
    UPDATE orders SET status = 'DELIVERING' WHERE status = 'PROCESSING';
    ALTER TABLE orders DROP CONSTRAINT IF EXISTS orders_status_check;
    ALTER TABLE orders ADD CONSTRAINT orders_status_check
        CHECK (status IN ('PENDING', 'PAID', 'DELIVERING', 'DELIVERED', 'CANCELLED'));
    ALTER TABLE orders DROP CONSTRAINT IF EXISTS orders_payment_method_check;
    ALTER TABLE orders ADD CONSTRAINT orders_payment_method_check
        CHECK (payment_method IN ('VNPAY', 'CASH', 'CARD'));

  000005_payos_payment_methods.sql: |
    UPDATE orders SET payment_method = 'QR_CODE' WHERE payment_method IN ('VNPAY', 'CARD');
    ALTER TABLE orders DROP CONSTRAINT IF EXISTS orders_payment_method_check;
    ALTER TABLE orders ADD CONSTRAINT orders_payment_method_check
        CHECK (payment_method IN ('QR_CODE', 'CASH'));

  000006_add_shipping_to_orders.sql: |
    ALTER TABLE orders
        ADD COLUMN IF NOT EXISTS shipping_phone VARCHAR(20) NOT NULL DEFAULT '',
        ADD COLUMN IF NOT EXISTS shipping_address TEXT NOT NULL DEFAULT '';

  000007_create_vietnam_locations.sql: |
    -- Source data: thanglequoc/vietnamese-provinces-database v2.4.1 (MIT).
    CREATE TABLE IF NOT EXISTS vn_provinces (
        code VARCHAR(20) PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        full_name VARCHAR(255) NOT NULL,
        code_name VARCHAR(255)
    );
    CREATE TABLE IF NOT EXISTS vn_districts (
        code VARCHAR(20) PRIMARY KEY,
        province_code VARCHAR(20) NOT NULL REFERENCES vn_provinces(code) ON DELETE CASCADE,
        name VARCHAR(255) NOT NULL,
        full_name VARCHAR(255) NOT NULL,
        code_name VARCHAR(255)
    );
    CREATE TABLE IF NOT EXISTS vn_wards (
        code VARCHAR(20) PRIMARY KEY,
        district_code VARCHAR(20) NOT NULL REFERENCES vn_districts(code) ON DELETE CASCADE,
        name VARCHAR(255) NOT NULL,
        full_name VARCHAR(255) NOT NULL,
        code_name VARCHAR(255)
    );
    CREATE INDEX IF NOT EXISTS idx_vn_districts_province_code ON vn_districts(province_code);
    CREATE INDEX IF NOT EXISTS idx_vn_wards_district_code ON vn_wards(district_code);

    INSERT INTO vn_provinces (code, name, full_name, code_name) VALUES
    ('01', 'Hà Nội', 'Thành phố Hà Nội', 'ha_noi'),
    ('02', 'Hà Giang', 'Tỉnh Hà Giang', 'ha_giang'),
    ('79', 'Hồ Chí Minh', 'Thành phố Hồ Chí Minh', 'ho_chi_minh')
    -- ... copy toàn bộ INSERT data từ deployment/k8s/13-order-migrations.yaml
    ON CONFLICT (code) DO NOTHING;
