apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ include "uav-store.namespace" . }}
  labels:
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          envFrom:
            - configMapRef:
                name: frontend-config
          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.health.path }}
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: {{ .Values.frontend.health.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.health.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.health.path }}
              port: {{ .Values.frontend.port }}
            initialDelaySeconds: {{ .Values.frontend.health.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.frontend.health.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ include "uav-store.namespace" . }}
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: http
  type: ClusterIP
