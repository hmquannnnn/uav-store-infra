# ── Config chung → render thành ConfigMap uav-store-config ───────────────────
config:
  DB_USER: postgres
  DB_SSL_MODE: require # RDS PostgreSQL 15+ force SSL
  APP_ENV: production
  ENV: local # giữ "local" để initContainer chạy migration (không có CI/CD migration riêng)

  USER_SERVICE_URL: http://user-service.uav-store.svc.cluster.local:8081
  FILE_SERVICE_URL: http://file-service.uav-store.svc.cluster.local:8082
  PRODUCT_SERVICE_URL: http://product-service.uav-store.svc.cluster.local:8083
  PRODUCT_SERVICE_GRPC_ADDRESS: product-service.uav-store.svc.cluster.local:9083
  ORDER_SERVICE_URL: http://order-service.uav-store.svc.cluster.local:8085
  ORDER_SERVICE_GRPC_ADDRESS: order-service.uav-store.svc.cluster.local:9085
  PAYMENT_SERVICE_URL: http://payment-service.uav-store.svc.cluster.local:8086

  # S3 thật (thay MinIO). minio-go nói chuyện thẳng S3; auth bằng IAM role của node.
  MINIO_ENDPOINT: s3.ap-southeast-1.amazonaws.com
  MINIO_PUBLIC_ENDPOINT: s3.ap-southeast-1.amazonaws.com
  MINIO_USE_SSL: "true"
  MINIO_REGION: ap-southeast-1
  MINIO_AUTH_TYPE: iam
  STORAGE_BUCKET_NAME: uav-store-data-537588573117

  API_GATEWAY_EXTERNAL_URL: https://api.uav-store.io.vn
  CORS_ALLOWED_ORIGINS: "https://uav-store.io.vn,https://www.uav-store.io.vn"

  PAYOS_RETURN_URL: "https://uav-store.io.vn/en/payment/result?state=success"
  PAYOS_CANCEL_URL: "https://uav-store.io.vn/en/payment/result?state=cancel"

# ── Frontend ──────────────────────────────────────────────────────────────────
frontend:
  image:
    repository: hmquannnnn/uav-store-fe
    tag: "d7e3a9d" # FE build với NEXT_PUBLIC_* trỏ S3/https
  replicas: 1
  port: 3000
  health:
    path: /en
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 20
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "768Mi"
      cpu: "750m"
  config:
    PORT: "3000"
    HOSTNAME: "0.0.0.0"
    NEXT_PUBLIC_API_ENDPOINT: "https://api.uav-store.io.vn/api"
    # S3 endpoint gốc (path-style) — file_path BE trả về đã chứa bucket, KHÔNG kèm bucket vào đây
    NEXT_PUBLIC_MINIO_PUBLIC_URL: "https://s3.ap-southeast-1.amazonaws.com"
    NEXT_PUBLIC_STORAGE_BASE_URL: "https://s3.ap-southeast-1.amazonaws.com"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: traefik
  tls:
    enabled: true
    issuer: letsencrypt-prod # ClusterIssuer (templates/clusterissuer.yaml)
  hosts:
    frontend:
      - uav-store.io.vn
      - www.uav-store.io.vn
    api: api.uav-store.io.vn
    # storage/minioConsole đã bỏ — file đi thẳng S3 qua presigned URL

# ══════════════════════════════════════════════════════════════════════════════
# Go services — key = alias khai báo trong Chart.yaml
# ══════════════════════════════════════════════════════════════════════════════

api-gateway:
  name: api-gateway
  image:
    repository: hmquannnnn/api-gateway
    tag: "3afa767"
  port: 8080
  replicas: 2
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  health:
    path: /health
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
  migration:
    enabled: false
  grpc:
    enabled: false
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    cpuUtilization: 70
  env:
    - name: PORT
      value: "8080"
    - name: USER_SERVICE_URL
      valueFrom:
        configMapKeyRef:
          name: uav-store-config
          key: USER_SERVICE_URL
    - name: FILE_SERVICE_URL
      valueFrom:
        configMapKeyRef:
          name: uav-store-config
          key: FILE_SERVICE_URL
    - name: PRODUCT_SERVICE_URL
      valueFrom:
        configMapKeyRef:
          name: uav-store-config
          key: PRODUCT_SERVICE_URL
    - name: ORDER_SERVICE_URL
      valueFrom:
        configMapKeyRef:
          name: uav-store-config
          key: ORDER_SERVICE_URL
    - name: PAYMENT_SERVICE_URL
      valueFrom:
        configMapKeyRef:
          name: uav-store-config
          key: PAYMENT_SERVICE_URL
    - name: CORS_ALLOWED_ORIGINS
      valueFrom:
        configMapKeyRef:
          name: uav-store-config
          key: CORS_ALLOWED_ORIGINS
          optional: true
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: uav-store-secrets
          key: jwt-secret

