# ── Config chung → render thành ConfigMap uav-store-config ───────────────────
config:
  DB_USER: postgres
  DB_SSL_MODE: disable
  APP_ENV: production
  ENV: local

  USER_SERVICE_URL: http://user-service.uav-store.svc.cluster.local:8081
  FILE_SERVICE_URL: http://file-service.uav-store.svc.cluster.local:8082
  PRODUCT_SERVICE_URL: http://product-service.uav-store.svc.cluster.local:8083
  PRODUCT_SERVICE_GRPC_ADDRESS: product-service.uav-store.svc.cluster.local:9083
  ORDER_SERVICE_URL: http://order-service.uav-store.svc.cluster.local:8085
  ORDER_SERVICE_GRPC_ADDRESS: order-service.uav-store.svc.cluster.local:9085
  PAYMENT_SERVICE_URL: http://payment-service.uav-store.svc.cluster.local:8086

  MINIO_ENDPOINT: minio.uav-store.svc.cluster.local:9000
  MINIO_PUBLIC_ENDPOINT: storage.uav-store.io.vn
  MINIO_USE_SSL: "false"
  MINIO_REGION: us-east-1
  STORAGE_BUCKET_NAME: uav-store

  API_GATEWAY_EXTERNAL_URL: http://api.uav-store.io.vn
  CORS_ALLOWED_ORIGINS: "http://uav-store.io.vn,http://www.uav-store.io.vn"

  PAYOS_RETURN_URL: "http://uav-store.io.vn/en/payment/result?state=success"
  PAYOS_CANCEL_URL: "http://uav-store.io.vn/en/payment/result?state=cancel"

# ── MinIO ─────────────────────────────────────────────────────────────────────
minio:
  image: minio/minio:latest
  storage: 5Gi
  serverUrl: "http://storage.uav-store.io.vn"
  consoleBrowserRedirectUrl: "http://minio.uav-store.io.vn"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# ── Frontend ──────────────────────────────────────────────────────────────────
frontend:
  image:
    repository: hmquannnnn/uav-store-fe
    tag: "3916901"
  replicas: 1
  port: 3000
  health:
    path: /en
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 20
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 10
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "768Mi"
      cpu: "750m"
  config:
    PORT: "3000"
    HOSTNAME: "0.0.0.0"
    NEXT_PUBLIC_API_ENDPOINT: "http://api.uav-store.io.vn/api"
    NEXT_PUBLIC_MINIO_PUBLIC_URL: "http://storage.uav-store.io.vn"
    NEXT_PUBLIC_STORAGE_BASE_URL: "http://storage.uav-store.io.vn"

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  className: traefik
  hosts:
    frontend:
      - uav-store.io.vn
      - www.uav-store.io.vn
    api: api.uav-store.io.vn
    storage: storage.uav-store.io.vn
    minioConsole: minio.uav-store.io.vn

# ══════════════════════════════════════════════════════════════════════════════
# Go services — key = alias khai báo trong Chart.yaml
# ══════════════════════════════════════════════════════════════════════════════

api-gateway:
  name: api-gateway
  image:
    repository: hmquannnnn/api-gateway
    tag: "0e5edd6"
  port: 8080
  replicas: 2
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  health:
    path: /health
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
  migration:
    enabled: false
  grpc:
    enabled: false
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 3
    cpuUtilization: 70
  env:
    - name: PORT
      value: "8080"
    - name: USER_SERVICE_URL
      valueFrom:
        configMapKeyRef:
          name: uav-store-config
          key: USER_SERVICE_URL
    - name: FILE_SERVICE_URL
      valueFrom:
        configMapKeyRef:
          name: uav-store-config
          key: FILE_SERVICE_URL
    - name: PRODUCT_SERVICE_URL
      valueFrom:
        configMapKeyRef:
          name: uav-store-config
          key: PRODUCT_SERVICE_URL
    - name: ORDER_SERVICE_URL
      valueFrom:
        configMapKeyRef:
          name: uav-store-config
          key: ORDER_SERVICE_URL
    - name: PAYMENT_SERVICE_URL
      valueFrom:
        configMapKeyRef:
          name: uav-store-config
          key: PAYMENT_SERVICE_URL
    - name: CORS_ALLOWED_ORIGINS
      valueFrom:
        configMapKeyRef:
          name: uav-store-config
          key: CORS_ALLOWED_ORIGINS
          optional: true
    - name: JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: uav-store-secrets
          key: jwt-secret

