apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      {{- if or .Values.migration.waitForHost (and .Values.migration.enabled .Values.migration.configMapName) }}
      initContainers:
        {{- if .Values.migration.waitForHost }}
        - name: wait-for-{{ .Values.migration.waitForName }}
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.migration.waitForHost }} {{ .Values.migration.waitForPort | default "5432" }}; do
                echo "Waiting for {{ .Values.migration.waitForName }}..."; sleep 2;
              done
              echo "{{ .Values.migration.waitForName }} is ready"
        {{- end }}
        {{- if and .Values.migration.enabled .Values.migration.configMapName }}
        - name: run-migrations
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              if [ "$ENV" != "local" ]; then
                echo "ENV=$ENV: migrations handled by CI/CD, skipping..."
                exit 0
              fi
              export DATABASE_URL="postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}"
              echo "ENV=local: running migrations..."
              for f in $(ls /migrations/*.sql | sort); do
                echo "Applying $f..."
                psql "$DATABASE_URL" -f "$f"
              done
              echo "Migrations completed"
          env:
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: ENV
            - name: DB_HOST
              value: {{ .Values.migration.dbHost | quote }}
            - name: DB_PORT
              value: {{ .Values.migration.dbPort | default "5432" | quote }}
            - name: DB_NAME
              value: {{ .Values.migration.dbName | quote }}
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: {{ .Values.migration.secretKey }}
            - name: DB_SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_SSL_MODE
          volumeMounts:
            - name: migrations
              mountPath: /migrations
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Values.name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: {{ .Values.port }}
            {{- if .Values.grpc.enabled }}
            - name: grpc
              containerPort: {{ .Values.grpc.port }}
            {{- end }}
          {{- if .Values.env }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.health.path | default "/health" }}
              port: {{ .Values.port }}
            initialDelaySeconds: {{ .Values.health.liveness.initialDelaySeconds | default 15 }}
            periodSeconds: {{ .Values.health.liveness.periodSeconds | default 20 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.health.path | default "/health" }}
              port: {{ .Values.port }}
            initialDelaySeconds: {{ .Values.health.readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.health.readiness.periodSeconds | default 10 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if and .Values.migration.enabled .Values.migration.configMapName }}
      volumes:
        - name: migrations
          configMap:
            name: {{ .Values.migration.configMapName }}
      {{- end }}
