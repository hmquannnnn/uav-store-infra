apiVersion: v2
name: uav-store
description: UAV Store — microservices platform for drone e-commerce
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  # ── Go services (go-service chart được dùng 6 lần với alias khác nhau) ──────
  - name: go-service
    version: "0.1.0"
    repository: "file://charts/go-service"
    alias: api-gateway

  - name: go-service
    version: "0.1.0"
    repository: "file://charts/go-service"
    alias: user-service

  - name: go-service
    version: "0.1.0"
    repository: "file://charts/go-service"
    alias: file-service

  - name: go-service
    version: "0.1.0"
    repository: "file://charts/go-service"
    alias: product-service

  - name: go-service
    version: "0.1.0"
    repository: "file://charts/go-service"
    alias: order-service

  - name: go-service
    version: "0.1.0"
    repository: "file://charts/go-service"
    alias: payment-service

  # ── PostgreSQL: KHÔNG self-host nữa — dùng RDS (uav-store-infra/terraform) ──
  # (subchart postgres giữ trong charts/ cho nhánh local, không khai báo dep ở đây)
