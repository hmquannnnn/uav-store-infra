apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: uav-store
  labels:
    app: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      initContainers:
        - name: wait-for-postgres-product
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-product.uav-store.svc.cluster.local 5432; do
                echo "Waiting for postgres-product..."; sleep 2;
              done
              echo "postgres-product is ready"
        - name: run-migrations
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              if [ "$ENV" != "local" ]; then
                echo "ENV=$ENV: migrations handled by CI/CD, skipping..."
                exit 0
              fi
              export DATABASE_URL="postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}"
              echo "ENV=local: running migrations..."
              for f in $(ls /migrations/*.sql | sort); do
                echo "Applying $f..."
                psql "$DATABASE_URL" -f "$f"
              done
              echo "Migrations completed"
          env:
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: ENV
            - name: DB_HOST
              value: postgres-product.uav-store.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: product_db
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: product-db-password
            - name: DB_SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_SSL_MODE
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: product-migrations
      containers:
        - name: product-service
          image: hmquannnnn/product-service:203cd92
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8083
            - name: grpc
              containerPort: 9083
          env:
            - name: APP_PORT
              value: "8083"
            - name: GRPC_PORT
              value: "9083"
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: APP_ENV
            - name: DB_HOST
              value: postgres-product.uav-store.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: product-db-password
            - name: DB_NAME
              value: product_db
            - name: DB_SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: DB_SSL_MODE
            # Giới hạn connection pool để 5 replica (HPA maxReplicas) × 15 = 75 conn
            # vẫn ở dưới ngưỡng postgres-product max_connections=100 (mặc định).
            - name: DB_MAX_CONNS
              value: "15"
            - name: DB_MAX_IDLE
              value: "5"
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: MINIO_ENDPOINT
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: minio-root-user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: uav-store-secrets
                  key: minio-root-password
            - name: MINIO_USE_SSL
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: MINIO_USE_SSL
            - name: STORAGE_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: uav-store-config
                  key: STORAGE_BUCKET_NAME
          livenessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: uav-store
  labels:
    app: product-service
spec:
  selector:
    app: product-service
  ports:
    - name: http
      port: 8083
      targetPort: http
    - name: grpc
      port: 9083
      targetPort: grpc
  type: ClusterIP
