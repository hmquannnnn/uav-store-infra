apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uav-store
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hmquannnnn/uav-store-infra.git
    targetRevision: dev
    path: helm/uav-store
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: uav-store
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
